name: Build Blockcraft Xbox UWP

on:
  workflow_dispatch:
    inputs:
      sdl2_uwp_zip_url:
        description: 'HTTPS URL to an x64 SDL2 UWP ZIP with include/SDL2, lib/SDL2.lib, and bin/SDL2.dll at its root'
        required: true
        type: string
      angle_uwp_zip_url:
        description: 'HTTPS URL to an x64 ANGLE UWP ZIP with bin/libEGL.dll, bin/libGLESv2.dll, and bin/d3dcompiler_47.dll at its root'
        required: true
        type: string
      publisher:
        description: 'Development certificate subject; must match the certificate used later for signing'
        required: false
        default: 'CN=Blockcraft Development'
        type: string
      uploaded_msix_url:
        description: 'Optional temporary HTTPS URL for an exact MSIX to sign instead of rebuilding'
        required: false
        default: ''
        type: string
      uploaded_msix_sha256:
        description: 'SHA-256 of uploaded_msix_url; required when signing an exact MSIX'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.uploaded_msix_url == '' }}
    name: Windows x64 UWP build
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_TRIPLET: x64-uwp
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\\.vcpkg-cache
      SDL2_ROOT: ${{ github.workspace }}\\.deps\\sdl2
      ANGLE_ROOT: ${{ github.workspace }}\\.deps\\angle
      LOVE_ROOT: ${{ github.workspace }}\\engine\\love-xbox-uwp-main
      HOST_ROOT: ${{ github.workspace }}\\xbox-uwp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up MSBuild and MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Windows build tools
        run: |
          cmake --version
          msbuild -version
          powershell -NoProfile -Command '$PSVersionTable.PSVersion'
          if (-not (Test-Path $env:WINDIR)) { throw 'Windows environment is unavailable.' }

      - name: Add Git zip tools to PATH
        run: echo 'C:\Program Files\Git\usr\bin' >> $env:GITHUB_PATH

      - name: Cache vcpkg downloads and builds
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\\.vcpkg-cache
            ${{ github.workspace }}\\vcpkg\\downloads
            ${{ github.workspace }}\\vcpkg\\buildtrees
          key: windows-2022-x64-uwp-vcpkg-${{ hashFiles('xbox-uwp/vcpkg-ports.lock') }}
          restore-keys: windows-2022-x64-uwp-vcpkg-

      - name: Download SDL2 UWP bundle
        env:
          SDL2_URL: ${{ inputs.sdl2_uwp_zip_url }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:SDL2_ROOT | Out-Null
          Invoke-WebRequest -Uri $env:SDL2_URL -OutFile "$env:RUNNER_TEMP\\sdl2-uwp.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\\sdl2-uwp.zip" -DestinationPath $env:SDL2_ROOT -Force
          if (-not (Test-Path "$env:SDL2_ROOT\\include\\SDL2\\SDL.h")) { throw 'SDL2 bundle is missing include/SDL2/SDL.h at its root.' }
          if (-not (Test-Path "$env:SDL2_ROOT\\lib\\SDL2.lib")) { throw 'SDL2 bundle is missing lib/SDL2.lib at its root.' }
          if (-not (Test-Path "$env:SDL2_ROOT\\bin\\SDL2.dll")) { throw 'SDL2 bundle is missing bin/SDL2.dll at its root.' }

      - name: Download ANGLE UWP bundle
        env:
          ANGLE_URL: ${{ inputs.angle_uwp_zip_url }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:ANGLE_ROOT | Out-Null
          Invoke-WebRequest -Uri $env:ANGLE_URL -OutFile "$env:RUNNER_TEMP\\angle-uwp.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\\angle-uwp.zip" -DestinationPath $env:ANGLE_ROOT -Force
          foreach ($file in @('libEGL.dll','libGLESv2.dll','d3dcompiler_47.dll')) {
            if (-not (Test-Path "$env:ANGLE_ROOT\\bin\\$file")) { throw "ANGLE bundle is missing bin/$file at its root." }
          }

      - name: Bootstrap vcpkg
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (Test-Path .\vcpkg) { Remove-Item .\vcpkg -Recurse -Force }
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          .\\vcpkg\\bootstrap-vcpkg.bat -disableMetrics
          .\\vcpkg\\vcpkg.exe install `
            'freetype[brotli,bzip2,png,zlib]:x64-uwp' `
            'libogg:x64-uwp' `
            'libtheora:x64-uwp' `
            'libvorbis:x64-uwp' `
            'openal-soft:x64-uwp' `
            'zlib:x64-uwp' `
            --clean-after-build

      - name: Configure LÖVE UWP engine
        run: |
          cmake -S $env:LOVE_ROOT -B "$env:LOVE_ROOT\\build\\uwp-x64-angle" `
            -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            '-DCMAKE_SYSTEM_VERSION=10.0' `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-uwp `
            -DLOVE_UWP_SDL_ROOT="$env:SDL2_ROOT" `
            -DLOVE_UWP_ANGLE=ON

      - name: Build LÖVE UWP engine
        run: cmake --build "$env:LOVE_ROOT\\build\\uwp-x64-angle" --config RelWithDebInfo --parallel

      - name: Configure Blockcraft UWP host
        run: |
          cmake -S $env:HOST_ROOT -B "$env:HOST_ROOT\\build\\relwithdebinfo" `
            -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_SYSTEM_NAME=WindowsStore `
            '-DCMAKE_SYSTEM_VERSION=10.0' `
            -DBLOCKCRAFT_SDL_ROOT="$env:SDL2_ROOT" `
            -DBLOCKCRAFT_LOVE_BUILD="$env:LOVE_ROOT\\build\\uwp-x64-angle\\RelWithDebInfo" `
            -DBLOCKCRAFT_PUBLISHER='${{ inputs.publisher }}'

      - name: Build Blockcraft UWP host
        run: cmake --build "$env:HOST_ROOT\\build\\relwithdebinfo" --config RelWithDebInfo --parallel

      - name: Sign MSIX and verify publisher
        shell: pwsh
        run: |
          Write-Host 'SIGNING: locating MSIX'
          $appPackages = Join-Path $env:HOST_ROOT 'build\\relwithdebinfo\\AppPackages'
          $package = Get-ChildItem -Path $appPackages -Filter '*.msix' -Recurse | Select-Object -First 1
          if (-not $package) { throw "No MSIX package found below $appPackages" }

          $manifestPath = Join-Path $env:HOST_ROOT 'build\\relwithdebinfo\\RelWithDebInfo\\AppxManifest.xml'
          if (-not (Test-Path $manifestPath)) { throw "Generated manifest not found: $manifestPath" }
          [xml]$manifest = Get-Content -Raw $manifestPath
          $publisher = [string]$manifest.Package.Identity.Publisher
          if ([string]::IsNullOrWhiteSpace($publisher)) { throw 'Package publisher is empty.' }

          $signDir = Join-Path $env:RUNNER_TEMP 'blockcraft-signed'
          New-Item -ItemType Directory -Force -Path $signDir | Out-Null
          $cerPath = Join-Path $signDir 'Blockcraft-Development.cer'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'Blockcraft-Development.pfx'
          $plainPassword = [guid]::NewGuid().ToString('N')
          $pfxPassword = ConvertTo-SecureString $plainPassword -AsPlainText -Force

          Write-Host "SIGNING: creating certificate for $publisher"
          # Avoid New-SelfSignedCertificate/Export-PfxCertificate provider hangs on some
          # hosted Windows runners. CertificateRequest creates the same self-signed
          # code-signing certificate entirely in-process and is bounded by this step.
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $request = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            $publisher,
            $rsa,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension]::new($false, $false, 0, $false))
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
              [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature, $false))
          $codeSigningOid = [System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3')
          $oidCollection = New-Object System.Security.Cryptography.OidCollection
          [void]$oidCollection.Add($codeSigningOid)
          $request.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new(
              $oidCollection, $false))
          $cert = $request.CreateSelfSigned((Get-Date).AddMinutes(-5), (Get-Date).AddYears(5))

          if ($cert.Subject -ne $publisher) { throw "Certificate subject '$($cert.Subject)' does not match package publisher '$publisher'." }
          Write-Host 'SIGNING: exporting public certificate and temporary PFX'
          [IO.File]::WriteAllBytes($cerPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          [IO.File]::WriteAllBytes($pfxPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $plainPassword))
          Import-Certificate -FilePath $cerPath -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\\Windows Kits\\10\\bin" -Filter 'signtool.exe' -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found.' }

          function Invoke-SignToolTimed([string[]]$arguments, [string]$operation) {
            $process = Start-Process -FilePath $signtool.FullName -ArgumentList $arguments -NoNewWindow -PassThru
            if (-not $process.WaitForExit(120000)) {
              $process.Kill()
              throw "signtool $operation timed out after 120 seconds"
            }
            if ($process.ExitCode -ne 0) { throw "signtool $operation failed with exit code $($process.ExitCode)" }
          }

          Write-Host 'SIGNING: signing package'
          Invoke-SignToolTimed @('sign', '/fd', 'SHA256', '/f', $pfxPath, '/p', $plainPassword, $package.FullName) 'sign'
          Write-Host 'SIGNING: verifying package signature'
          Invoke-SignToolTimed @('verify', '/pa', '/all', $package.FullName) 'verify'
          Write-Host 'SIGNING: signature verification passed'

          $signedPackage = Join-Path $signDir $package.Name
          Copy-Item $package.FullName $signedPackage -Force
          $dependency = Get-ChildItem -Path $appPackages -Filter 'Microsoft.VCLibs.x64.14.00.appx' -Recurse | Select-Object -First 1
          if ($dependency) { Copy-Item $dependency.FullName (Join-Path $signDir $dependency.Name) -Force }
          $verification = [ordered]@{
            package = $package.Name
            architecture = [string]$manifest.Package.Identity.ProcessorArchitecture
            publisher = $publisher
            certificate_subject = $cert.Subject
            certificate_thumbprint = $cert.Thumbprint
            signature_verified = $true
          }
          $verification | ConvertTo-Json | Set-Content (Join-Path $signDir 'SIGNATURE-VERIFIED.json')

          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\Root\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue

      - name: Collect build outputs and logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\\blockcraft-uwp-artifacts" | Out-Null
          if (Test-Path "$env:LOVE_ROOT\\build") { Copy-Item "$env:LOVE_ROOT\\build" "$env:RUNNER_TEMP\\blockcraft-uwp-artifacts\\love-build" -Recurse -Force }
          if (Test-Path "$env:HOST_ROOT\\build") { Copy-Item "$env:HOST_ROOT\\build" "$env:RUNNER_TEMP\\blockcraft-uwp-artifacts\\host-build" -Recurse -Force }
          if (Test-Path "$env:RUNNER_TEMP\\blockcraft-signed") { Copy-Item "$env:RUNNER_TEMP\\blockcraft-signed" "$env:RUNNER_TEMP\\blockcraft-uwp-artifacts\\signed" -Recurse -Force }
          Get-ChildItem "$env:RUNNER_TEMP\\blockcraft-uwp-artifacts" -Recurse -File | Select-Object FullName,Length | Out-File "$env:RUNNER_TEMP\\blockcraft-uwp-artifacts\\inventory.txt"

      - name: Upload Windows build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockcraft-xbox-uwp-windows-build-${{ github.run_number }}
          path: ${{ runner.temp }}\\blockcraft-uwp-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed install bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blockcraft-xbox-uwp-signed-${{ github.run_number }}
          path: ${{ runner.temp }}\\blockcraft-signed
          if-no-files-found: error
          retention-days: 14

  sign-uploaded:
    name: Sign exact uploaded MSIX
    if: ${{ inputs.uploaded_msix_url != '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download and hash-verify exact MSIX
        env:
          PACKAGE_URL: ${{ inputs.uploaded_msix_url }}
          EXPECTED_SHA256: ${{ inputs.uploaded_msix_sha256 }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'blockcraft-sign'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $package = Join-Path $work 'BlockcraftUWP_0.1.0.0_x64_RelWithDebInfo.msix'
          Invoke-WebRequest -Uri $env:PACKAGE_URL -OutFile $package
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:EXPECTED_SHA256.ToLowerInvariant()) { throw "MSIX hash mismatch: $hash" }
          "PACKAGE_PATH=$package" | Out-File $env:GITHUB_ENV -Append
      - name: Verify manifest identity
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($env:PACKAGE_PATH)
          try {
            $entry = $zip.GetEntry('AppxManifest.xml')
            $reader = New-Object IO.StreamReader($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $identity = $manifest.Package.Identity
          if ([string]$identity.Publisher -ne '${{ inputs.publisher }}') { throw "Publisher mismatch: $($identity.Publisher)" }
          Write-Host "Publisher: $($identity.Publisher); Architecture: $($identity.ProcessorArchitecture)"
      - name: Generate certificate, sign, and verify
        run: |
          $signDir = Join-Path $env:RUNNER_TEMP 'blockcraft-signed'
          New-Item -ItemType Directory -Force -Path $signDir | Out-Null
          $cerPath = Join-Path $signDir 'Blockcraft-Development.cer'
          $pfxPath = Join-Path $env:RUNNER_TEMP 'Blockcraft-Development.pfx'
          $keyPath = Join-Path $env:RUNNER_TEMP 'Blockcraft-Development.key.pem'
          $pemPath = Join-Path $env:RUNNER_TEMP 'Blockcraft-Development.cert.pem'
          $cfgPath = Join-Path $env:RUNNER_TEMP 'Blockcraft-Development.cnf'
          $password = [guid]::NewGuid().ToString('N')
          @"
[ req ]
distinguished_name = subject
x509_extensions = extensions
prompt = no
[ subject ]
CN = Blockcraft Development
[ extensions ]
basicConstraints = critical,CA:FALSE
keyUsage = critical,digitalSignature
extendedKeyUsage = critical,codeSigning
subjectKeyIdentifier = hash
"@ | Set-Content -Encoding ascii $cfgPath
          $openssl = (Get-Command openssl.exe -ErrorAction Stop).Source
          & $openssl req -x509 -newkey rsa:2048 -sha256 -days 1825 -nodes -keyout $keyPath -out $pemPath -config $cfgPath -set_serial ("0x" + ([guid]::NewGuid().ToString('N'))) 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL certificate generation failed.' }
          & $openssl pkcs12 -export -legacy -out $pfxPath -inkey $keyPath -in $pemPath -passout ("pass:" + $password) -name 'Blockcraft Development' 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL PFX export failed.' }
          & $openssl x509 -in $pemPath -outform DER -out $cerPath 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL CER export failed.' }
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($cerPath)
          if ($cert.Subject -ne '${{ inputs.publisher }}') { throw "Certificate subject mismatch: $($cert.Subject)" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter 'signtool.exe' -Recurse | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found.' }
          $p = Start-Process $signtool.FullName -ArgumentList @('sign','/fd','SHA256','/f',$pfxPath,'/p',$password,$env:PACKAGE_PATH) -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'signtool sign timed out.' }
          if ($p.ExitCode -ne 0) { throw "signtool sign failed: $($p.ExitCode)" }
          $p = Start-Process $signtool.FullName -ArgumentList @('verify','/pa','/all',$env:PACKAGE_PATH) -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'signtool verify timed out.' }
          if ($p.ExitCode -ne 0) { throw "signtool verify failed: $($p.ExitCode)" }
          Copy-Item $env:PACKAGE_PATH (Join-Path $signDir (Split-Path $env:PACKAGE_PATH -Leaf)) -Force
          [ordered]@{ package = (Split-Path $env:PACKAGE_PATH -Leaf); publisher = '${{ inputs.publisher }}'; certificate_subject = $cert.Subject; certificate_thumbprint = $cert.Thumbprint; signature_verified = $true; signed_sha256 = (Get-FileHash $env:PACKAGE_PATH -Algorithm SHA256).Hash } | ConvertTo-Json | Set-Content (Join-Path $signDir 'SIGNATURE-VERIFIED.json')
          Remove-Item $pfxPath,$keyPath,$pemPath,$cfgPath -Force -ErrorAction SilentlyContinue
      - name: Upload verified signed package and certificate
        uses: actions/upload-artifact@v4
        with:
          name: blockcraft-xbox-signed-uploaded-msix
          path: ${{ runner.temp }}\blockcraft-signed
          if-no-files-found: error
          retention-days: 3
